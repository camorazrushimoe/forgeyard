name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to create or update"
        required: true
        default: "v0.1.0"

permissions:
  contents: write

jobs:
  darwin-arm64:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build --release --workspace
      - name: pack
        run: |
          mkdir -p pack-bin
          for b in fy forge yard watch; do cp "target/release/$b" pack-bin/; done
          tar -C pack-bin -czf forgeyard-darwin-arm64.tar.gz fy forge yard watch
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          name: ${{ github.event.inputs.tag || github.ref_name }}
          files: forgeyard-darwin-arm64.tar.gz
          generate_release_notes: true
